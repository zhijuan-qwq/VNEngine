<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>VNEngine Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060c;
        overflow: hidden;
      }
      /* 外层：固定视口 + 安全区；100dvh 处理移动端地址栏伸缩 */
      #app-root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* 内层：画布宿主，clientWidth/clientHeight 即安全区内的内容盒 */
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      #app canvas {
        display: block;
      }
      /* 竖屏提示：仅触摸-only 竖屏显示，覆盖并阻止误触底层画布 */
      #rotate-hint {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(5, 6, 12, 0.92);
        color: #e6e8f0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
        user-select: none;
      }
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <div id="app">
        <div id="rotate-hint" role="status" aria-live="polite">
          请将设备旋转至横屏
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
